<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geliştirici Sayfası</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; 
            padding: 50px 20px; 
            color: #333; 
            background-color: #f9f9f9;
        }
        h1 { color: #007AFF; }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hoş Geldiniz</h1>
        <p><strong>Maç Saati</strong>, <strong>eDavranış</strong> ve <strong>Ek Dersim</strong> uygulamalarının resmi geliştirici sayfasına hoş geldiniz.</p>
        <p>Uygulamalarımıza gösterdiğiniz ilgi için teşekkür ederiz. Destek talepleriniz, geri bildirimleriniz ve önerileriniz için uygulama içi iletişim kanallarını kullanabilirsiniz.</p>
    </div>
</body>
</html>
